# Nginx site for OSLEOS — its own server block, proxies to the PM2 app on
# 127.0.0.1:3100. Replace DOMAIN_HERE (setup-vps.sh does this for you),
# then run certbot for HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_HERE www.DOMAIN_HERE;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets never change — cache for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3100;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
