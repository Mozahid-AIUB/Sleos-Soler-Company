name: CI

# Lint + build every push. The VPS watcher (deploy/autodeploy) only deploys a
# commit after these checks pass, so a broken commit never reaches the site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
